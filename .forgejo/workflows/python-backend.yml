name: Build and test package

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-package:
    name: Build package for Sisyphus
    runs-on: als-tiny
    container:
      image: altlinux.space/actions/runner/hasherc:sisyphus
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Build and test RPMs
        uses: actions/build-rpm-action@main

      - name: Upload packages as CI artifact
        uses: actions/upload-artifact@v3
        with:
          name: alt-packages
          path: ~/.cache/hasherc/freeipa-server-gpo/out/RPMS/**/*.rpm
