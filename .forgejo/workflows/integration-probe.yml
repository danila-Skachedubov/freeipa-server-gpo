name: Probe integration container support

on:
  workflow_dispatch:
  push:
    branches:
      - ci/integration-container-probe

jobs:
  build-integration-rpm:
    name: Build RPM for integration probe
    runs-on: als-tiny
    container:
      image: altlinux.space/actions/runner/hasherc:sisyphus

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Build and test RPMs
        uses: actions/build-rpm-action@main

      - name: Upload integration RPM
        uses: actions/upload-artifact@v3
        with:
          name: integration-rpm
          path: ~/.cache/hasherc/freeipa-server-gpo/out/RPMS/**/*.rpm

  container-runtime-probe:
    name: Install project RPM in a minimal FreeIPA domain
    needs: build-integration-rpm
    runs-on: als-huge
    timeout-minutes: 60
    container:
      image: altlinux.space/actions/runner/containers:sisyphus
      options: --privileged

    steps:
      - name: Download integration RPM
        uses: actions/download-artifact@v3
        with:
          name: integration-rpm
          path: /tmp/ipa-gpo-rpms

      - name: Verify integration RPM artifact
        run: |
          set -euo pipefail

          mapfile -t project_rpms < <(
            find /tmp/ipa-gpo-rpms -type f \
              -name 'freeipa-server-gpo-*.rpm' \
              ! -name '*.src.rpm' \
              ! -name '*debuginfo*' \
              -print
          )

          if [ "${#project_rpms[@]}" -ne 1 ]; then
            printf 'Expected exactly one project RPM, found %s:\n' \
              "${#project_rpms[@]}"
            find /tmp/ipa-gpo-rpms -type f -print
            exit 1
          fi

          rpm -qpi "${project_rpms[0]}"

      - name: Inspect runner container
        run: |
          set -euxo pipefail

          id
          uname -a
          podman --version
          podman info
          findmnt -T /sys/fs/cgroup
          cat /proc/self/cgroup

      - name: Probe nested Podman
        run: |
          set -euxo pipefail

          podman run --rm \
            registry.altlinux.org/sisyphus/alt:latest \
            /bin/true

          podman run --rm --privileged \
            registry.altlinux.org/sisyphus/alt:latest \
            /usr/bin/id

      - name: Build minimal ALT systemd image
        run: |
          set -euxo pipefail

          podman build --tag localhost/ipa-gpo-systemd-probe:latest -f - . <<'EOF'
          FROM registry.altlinux.org/sisyphus/alt:latest
          RUN apt-get update \
              && apt-get install -y systemd dbus \
              && apt-get clean
          STOPSIGNAL SIGRTMIN+3
          CMD ["/sbin/init"]
          EOF

      - name: Probe systemd inside nested container
        run: |
          set -euxo pipefail

          podman run --detach \
            --name ipa-gpo-systemd-probe \
            --privileged \
            --systemd=always \
            ipa-gpo-systemd-probe

          system_state=""
          for attempt in $(seq 1 30); do
            system_state="$(podman exec ipa-gpo-systemd-probe \
              systemctl is-system-running 2>/dev/null || true)"
            case "$system_state" in
              running|degraded)
                break
                ;;
            esac
            sleep 1
          done

          podman exec ipa-gpo-systemd-probe \
            systemctl --no-pager --full status || true

          case "$system_state" in
            running|degraded)
              echo "Nested systemd reached acceptable state: $system_state"
              ;;
            *)
              echo "Nested systemd did not start: $system_state"
              exit 1
              ;;
          esac

      - name: Build ALT FreeIPA server image
        run: |
          set -euxo pipefail

          podman build --tag localhost/ipa-gpo-freeipa-probe:latest -f - . <<'EOF'
          FROM localhost/ipa-gpo-systemd-probe:latest
          RUN apt-get update \
              && apt-get install -y freeipa-server \
              && apt-get clean
          EOF

      - name: Verify FreeIPA package payload
        run: |
          set -euxo pipefail

          podman run --rm \
            localhost/ipa-gpo-freeipa-probe:latest \
            rpm -q freeipa-server freeipa-server-core

          podman run --rm \
            localhost/ipa-gpo-freeipa-probe:latest \
            ipa-server-install --help >/dev/null

      - name: Probe systemd in FreeIPA image
        run: |
          set -euxo pipefail

          podman run --detach \
            --name ipa-gpo-freeipa-probe \
            --hostname server.ipa.test \
            --privileged \
            --systemd=always \
            localhost/ipa-gpo-freeipa-probe:latest

          system_state=""
          for attempt in $(seq 1 30); do
            system_state="$(podman exec ipa-gpo-freeipa-probe \
              systemctl is-system-running 2>/dev/null || true)"
            case "$system_state" in
              running|degraded)
                break
                ;;
            esac
            sleep 1
          done

          podman exec ipa-gpo-freeipa-probe \
            rpm -q freeipa-server freeipa-server-core
          podman exec ipa-gpo-freeipa-probe \
            systemctl is-active dbus.service

          case "$system_state" in
            running|degraded)
              echo "FreeIPA image reached acceptable state: $system_state"
              ;;
            *)
              echo "FreeIPA image did not start: $system_state"
              exit 1
              ;;
          esac

      - name: Install minimal IPA domain
        run: |
          set -euo pipefail

          ipa_hostname="$(podman exec ipa-gpo-freeipa-probe hostname --fqdn)"
          ipa_address="$(podman inspect \
            --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \
            ipa-gpo-freeipa-probe)"

          test "$ipa_hostname" = "server.ipa.test"
          test -n "$ipa_address"

          podman exec ipa-gpo-freeipa-probe \
            getent hosts server.ipa.test

          podman exec ipa-gpo-freeipa-probe \
            ipa-server-install \
              --unattended \
              --hostname=server.ipa.test \
              --ip-address="$ipa_address" \
              --domain=ipa.test \
              --realm=IPA.TEST \
              --ds-password='IpaTest-Directory-42!' \
              --admin-password='IpaTest-Administrator-42!' \
              --no-ntp \
              --no-host-dns \
              --no-ssh \
              --no-sshd

      - name: Verify IPA domain
        run: |
          set -euo pipefail

          podman exec ipa-gpo-freeipa-probe ipactl status

          printf '%s\n' 'IpaTest-Administrator-42!' | \
            podman exec --interactive ipa-gpo-freeipa-probe \
              kinit admin

          podman exec ipa-gpo-freeipa-probe klist
          podman exec ipa-gpo-freeipa-probe ipa ping
          podman exec ipa-gpo-freeipa-probe \
            ipa user-show admin

      - name: Install project RPM in IPA server
        run: |
          set -euo pipefail

          mapfile -t project_rpms < <(
            find /tmp/ipa-gpo-rpms -type f \
              -name 'freeipa-server-gpo-*.rpm' \
              ! -name '*.src.rpm' \
              ! -name '*debuginfo*' \
              -print
          )
          test "${#project_rpms[@]}" -eq 1

          podman cp \
            "${project_rpms[0]}" \
            ipa-gpo-freeipa-probe:/tmp/freeipa-server-gpo.rpm

          podman exec ipa-gpo-freeipa-probe \
            apt-get update
          podman exec ipa-gpo-freeipa-probe \
            apt-get install -y /tmp/freeipa-server-gpo.rpm

          podman exec ipa-gpo-freeipa-probe \
            rpm -q freeipa-server-gpo
          podman exec ipa-gpo-freeipa-probe \
            rpm -V freeipa-server-gpo
          podman exec ipa-gpo-freeipa-probe \
            test -x /usr/bin/ipa-gpo-install

      - name: Configure and verify GPO backend
        run: |
          set -euo pipefail

          podman exec ipa-gpo-freeipa-probe \
            ipa-gpo-install --debuglevel=2
          podman exec ipa-gpo-freeipa-probe \
            ipa-gpo-install --debuglevel=2 --check-only

          podman exec ipa-gpo-freeipa-probe \
            ipactl status
          podman exec ipa-gpo-freeipa-probe \
            ipa ping
          podman exec ipa-gpo-freeipa-probe \
            test -d /var/lib/freeipa/sysvol/ipa.test/Policies
          podman exec ipa-gpo-freeipa-probe \
            test -d /var/lib/freeipa/gpo-editor-state

      - name: Collect diagnostics and clean up
        if: ${{ always() }}
        run: |
          set +e

          podman ps --all
          podman logs ipa-gpo-systemd-probe
          podman exec ipa-gpo-systemd-probe \
            journalctl -b --no-pager
          podman logs ipa-gpo-freeipa-probe
          podman exec ipa-gpo-freeipa-probe \
            journalctl -b --no-pager
          podman exec ipa-gpo-freeipa-probe \
            ipactl status
          podman exec ipa-gpo-freeipa-probe \
            tail -n 300 /var/log/ipaserver-install.log
          podman exec ipa-gpo-freeipa-probe \
            tail -n 300 /var/log/freeipa/ipa-gpo-install.log
          podman exec ipa-gpo-freeipa-probe \
            rpm -q freeipa-server-gpo
          podman rm --force ipa-gpo-freeipa-probe
          podman rm --force ipa-gpo-systemd-probe
          podman image rm localhost/ipa-gpo-freeipa-probe:latest
          podman image rm localhost/ipa-gpo-systemd-probe:latest
